<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Logo Q-Coffee" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Q-Coffee</title>
  <rect width="200" height="200" rx="44" fill="#2B1B14"/>
  <!-- Chữ Q = miệng tách cà phê nhìn từ trên xuống -->
  <circle cx="96" cy="98" r="50" fill="#4A2C1B" stroke="#FBF8F3" stroke-width="14"/>
  <!-- Lớp crema ánh lên -->
  <path d="M70 92 A28 28 0 0 1 104 70" fill="none" stroke="#E8A33D" stroke-width="6" stroke-linecap="round"/>
  <!-- Đuôi chữ Q = quai tách -->
  <path d="M132 134 L160 162" stroke="#E8A33D" stroke-width="16" stroke-linecap="round"/>
  <!-- Tia sáng = sáng tạo -->
  <path d="M158 24 Q160 40 176 42 Q160 44 158 60 Q156 44 140 42 Q156 40 158 24Z" fill="#E8A33D"/>
</svg>
